
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        color: #111;
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin-bottom: 10px;
    }

    .game-box {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 18px;
        border-radius: 16px;
        box-shadow: 0 5px 20px #0001;
    }

    .score {
        font-size: 22px;
        font-weight: bold;
        margin: 12px;
    }

    canvas {
        display: block;
        width: 100%;
        max-width: 400px;
        height: auto;
        margin: 15px auto;
        border: 3px solid #222;
        background: #ffffff;
        border-radius: 8px;
    }

    .colors {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin: 15px 0;
    }

    .colors label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
    }

    input[type="color"] {
        width: 42px;
        height: 35px;
        border: none;
        cursor: pointer;
    }

    button {
        padding: 11px 20px;
        border: none;
        border-radius: 8px;
        background: #111;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
    }

    button:hover {
        background: #444;
    }

    #message {
        font-weight: bold;
        min-height: 24px;
    }
</style>
</head>

<body>

<div class="game-box">
    <h1>🐍 Snake Game</h1>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="colors">
        <label>
            Snake Color
            <input type="color" id="snakeColor" value="#000000">
        </label>

        <label>
            Fruit Color
            <input type="color" id="fruitColor" value="#FFD700">
        </label>

        <label>
            Background
            <input type="color" id="bgColor" value="#FFFFFF">
        </label>
    </div>

    <p id="message">Arrow keys se game khelo!</p>

    <button id="startBtn">Start Game</button>
    <button id="restartBtn">Restart</button>

    <p>⬆️ ⬇️ ⬅️ ➡️ Use Arrow Keys</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const snakePicker = document.getElementById("snakeColor");
const fruitPicker = document.getElementById("fruitColor");
const bgPicker = document.getElementById("bgColor");

const size = 20;
const cells = canvas.width / size;

let snake, fruit, dx, dy, score;
let timer = null;
let running = false;
let gameOver = false;

function randomFruit() {
    let position;

    do {
        position = {
            x: Math.floor(Math.random() * cells),
            y: Math.floor(Math.random() * cells)
        };
    } while (
        snake.some(part =>
            part.x === position.x && part.y === position.y
        )
    );

    return position;
}

function resetGame() {
    clearInterval(timer);
    timer = null;

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    dx = 1;
    dy = 0;
    score = 0;
    running = false;
    gameOver = false;

    scoreText.textContent = score;
    fruit = randomFruit();

    message.textContent = "Start dabao aur game khelo!";
    draw();
}

function draw() {
    ctx.fillStyle = bgPicker.value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw fruit
    ctx.fillStyle = fruitPicker.value;
    ctx.beginPath();
    ctx.arc(
        fruit.x * size + size / 2,
        fruit.y * size + size / 2,
        size / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Fruit stem
    ctx.strokeStyle = "#39813b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(fruit.x * size + 10, fruit.y * size + 5);
    ctx.lineTo(fruit.x * size + 13, fruit.y * size + 1);
    ctx.stroke();

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = snakePicker.value;
        ctx.fillRect(
            part.x * size + 1,
            part.y * size + 1,
            size - 2,
            size - 2
        );

        // Snake eyes
        if (index === 0) {
            ctx.fillStyle = snakePicker.value === "#000000"
                ? "#FFFFFF" : "#000000";

            ctx.beginPath();
            ctx.arc(
                part.x * size + 14,
                part.y * size + 6,
                2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    });
}

function startGame() {
    if (running) return;

    if (gameOver) resetGame();

    running = true;
    message.textContent = "Game chal raha hai!";
    clearInterval(timer);
    timer = setInterval(update, 120);
}

function update() {
    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    const ateFruit =
        head.x === fruit.x && head.y === fruit.y;

    const bodyToCheck = ateFruit ? snake : snake.slice(0, -1);

    const hitWall =
        head.x < 0 || head.x >= cells ||
        head.y < 0 || head.y >= cells;

    const hitSnake = bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    );

    if (hitWall || hitSnake) {
        running = false;
        gameOver = true;
        clearInterval(timer);
        timer = null;
        message.textContent = "Game Over! Restart dabao.";
        return;
    }

    snake.unshift(head);

    if (ateFruit) {
        score += 10;
        scoreText.textContent = score;
        fruit = randomFruit();
    } else {
        snake.pop();
    }

    draw();
}

document.addEventListener("keydown", event => {
    const keys = [
        "ArrowUp", "ArrowDown",
        "ArrowLeft", "ArrowRight"
    ];

    if (keys.includes(event.key)) {
        event.preventDefault();
    }

    if (event.key === "ArrowUp" && dy !== 1) {
        dx = 0;
        dy = -1;
    } else if (event.key === "ArrowDown" && dy !== -1) {
        dx = 0;
        dy = 1;
    } else if (event.key === "ArrowLeft" && dx !== 1) {
        dx = -1;
        dy = 0;
    } else if (event.key === "ArrowRight" && dx !== -1) {
        dx = 1;
        dy = 0;
    }
});

document.getElementById("startBtn").addEventListener(
    "click", startGame
);

document.getElementById("restartBtn").addEventListener(
    "click", resetGame
);

// Color change karte hi game update hoga
snakePicker.addEventListener("input", draw);
fruitPicker.addEventListener("input", draw);
bgPicker.addEventListener("input", draw);

resetGame();
</script>

</body>
</html>
